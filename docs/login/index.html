<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blendStory · AUTH_GATE</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #080a0c; --bg2: #0c0e12; --bg3: #12161a;
  --amber: #ffb000; --amber-dim: #996a00; --amber-deep: #442a00;
  --fg: #d0d8e0; --dim: #3a4a5a; --border: #1a1e24;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,176,0,0.02) 3px,rgba(255,176,0,0.02) 4px);
  pointer-events:none;z-index:9000;
}

/* GRID BG */
.forge-grid{
  position:fixed;inset:0;
  background-image: 
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 1; opacity: 0.3;
}

.terminal{
  position:relative;z-index:10;width:min(440px,95vw);
  background:rgba(12,14,18,0.95);border:1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.t-header{
  background:var(--bg3);padding:12px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.t-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;}
.t-led{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}

.t-body{padding:40px;}
.t-msg{font-size:11px;color:var(--dim);margin-bottom:32px;letter-spacing:1px;line-height:1.6;}
.t-msg span{color:var(--amber-dim);}

.field-group{margin-bottom:24px;}
.field-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:2px;margin-bottom:8px;display:block;}
input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--amber);padding:12px 16px;font-size:14px;outline:none;
  transition:border-color 0.3s, box-shadow 0.3s;
}
input:focus{border-color:var(--amber-dim);box-shadow:0 0 15px rgba(255,176,0,0.1);}

.btn{
  width:100%;padding:16px;background:transparent;border:1px solid var(--amber-dim);
  color:var(--amber);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;cursor:pointer;transition:all 0.3s;margin-top:16px;
}
.btn:hover{background:rgba(255,176,0,0.05);border-color:var(--amber);box-shadow:0 0 20px rgba(255,176,0,0.2);}

.footer-links{margin-top:32px;display:flex;justify-content:center;gap:24px;}
.f-link{font-size:9px;color:var(--dim);text-decoration:none;letter-spacing:1px;text-transform:uppercase;}
.f-link:hover{color:var(--amber-dim);}

</style>
</head>
<body>

<div class="forge-grid"></div>

<div class="terminal">
  <div class="t-header">
    <div class="t-title">AMBER_FORGE // AUTH_GATE</div>
    <div class="t-led"></div>
  </div>
  <div class="t-body">
    <div class="t-msg">
      INITIALIZING_NEURAL_LINK...<br>
      STATUS: <span>WAITING_FOR_CREDENTIALS</span><br>
      LEVEL: <span>ADMIN_ONLY</span>
    </div>
    
    <div class="field-group">
      <label class="field-label">USER_IDENTIFIER</label>
      <input type="text" id="username" placeholder="SYS_ALIAS" autocomplete="off">
    </div>
    
    <div class="field-group">
      <label class="field-label">ACCESS_SECRET</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <button class="btn" onclick="handleLogin()">[ ENGAGE_LINK ]</button>
    
    <div class="footer-links">
      <a href="../" class="f-link">RET_TO_EXTERIOR</a>
      <a href="https://jezabel.net" class="f-link">JEZABEL.NET</a>
    </div>
  </div>
</div>

<script>
function handleLogin() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  
  if (!u || !p) return alert('CREDENTIALS_REQUIRED');
  
  // Mock login for Amber Forge
  localStorage.setItem('jezabel_token', 'mock_token_admin');
  localStorage.setItem('jezabel_user', JSON.stringify({
    username: u,
    tier: 'admin',
    id: 1
  }));
  
  window.location.href = '../dashboard/';
}
</script>

</body>
</html>
