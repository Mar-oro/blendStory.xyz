<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blendStory · AMBER_FORGE_DASHBOARD</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=JetBrains+Mono:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #080a0c; --bg2: #0c0e12; --bg3: #12161a;
  --amber: #ffb000; --amber-dim: #996a00; --amber-deep: #442a00;
  --blue: #0055ff; --blue-dim: #0033aa;
  --fg: #d0d8e0; --dim: #3a4a5a; --border: #1a1e24;
  --led-ok: #00ff41; --led-warn: #ffb000; --led-err: #ff2929;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;}
body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);color:var(--fg);
  font-size:13px;line-height:1.4;overflow:hidden;
  display: flex; flex-direction: column;
}

/* SCANLINES */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,176,0,0.02) 3px,rgba(255,176,0,0.02) 4px);
  pointer-events:none;z-index:9000;
}

/* GRID BG */
.forge-grid{
  position:fixed;inset:0;
  background-image: 
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 1; opacity: 0.3;
}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;gap:24px;padding:0 32px;
  background:rgba(8,10,12,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--amber-deep);height:64px;position:relative;z-index:100;
  flex-shrink: 0;
}
.brand{
  font-family:'Cinzel',serif;font-size:18px;letter-spacing:4px;color:var(--amber);
  text-decoration:none;text-shadow:0 0 15px rgba(255,176,0,0.4);
}
.brand .sub{font-family:'Space Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:2px;margin-left:12px;text-transform:uppercase;}
.bar-spacer{flex:1}
.nav-links{display:flex;gap:32px;}
.nav-link{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--dim);
  text-decoration:none;transition:all 0.3s;text-transform:uppercase;cursor:pointer;
}
.nav-link:hover, .nav-link.active{color:var(--amber);text-shadow:0 0 10px var(--amber-dim);}

/* NODE ENGINE */
.engine-container{
  position:relative;width:100%;flex:1;
  overflow:hidden;z-index:10;
}
#nodeCanvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:5;pointer-events:none;
}
.node-view{
  position:absolute;inset:0;cursor:grab;z-index:10;
}
.node-view:active{cursor:grabbing;}

/* MODULE NODES */
.module{
  position:absolute;width:220px;
  background:rgba(12,14,18,0.95);border:1px solid var(--border);
  padding:1px;box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition:border-color 0.3s, box-shadow 0.3s;
  user-select:none;
}
.module:hover{
  border-color:var(--amber-dim);
  box-shadow: 0 10px 40px rgba(255,176,0,0.1);
}
.module.active{border-color:var(--amber);box-shadow: 0 0 20px rgba(255,176,0,0.2);}

.module-header{
  background:var(--bg3);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  cursor:move;
}
.module-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;}
.module-led{width:6px;height:6px;border-radius:50%;background:var(--led-ok);box-shadow:0 0 8px var(--led-ok);}

.module-body{padding:16px;font-size:11px;color:var(--dim);}
.module-label{color:var(--fg);font-size:14px;margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.module-text{opacity:0.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; font-size:10px;}

/* SOCKETS */
.socket{
  position:absolute;width:14px;height:14px;background:var(--bg2);border:2px solid var(--border);
  border-radius:50%;z-index:20;transition:all 0.2s;
  cursor:crosshair;
}
.socket:hover{border-color:var(--amber);background:var(--amber-deep);}
.socket.connected{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px var(--amber);}
.socket.in{left:-8px;top:50%;transform:translateY(-50%);}
.socket.out{right:-8px;top:50%;transform:translateY(-50%);}

/* COMMAND BAR */
.cmdbar{
  height:40px;background:var(--bg3);border-top:1px solid var(--amber-deep);
  display:flex;align-items:center;padding:0 24px;gap:12px;z-index:100;
}
.cmd-prompt{color:var(--amber);font-family:'Space Mono',monospace;font-size:14px;}
.cmd-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;
}
.cmd-msg{font-size:10px;color:var(--dim);letter-spacing:1px;}

/* SIDEBAR / CONFIG */
.sidebar{
  position:absolute;top:0;bottom:0;width:320px;background:rgba(10,12,14,0.95);
  border-left:1px solid var(--amber-deep);right:-320px;transition:right 0.4s cubic-bezier(0.19, 1, 0.22, 1);
  z-index:200;padding:32px;backdrop-filter:blur(15px);display:flex;flex-direction:column;
}
.sidebar.open{right:0;}
.sb-header{margin-bottom:32px; border-bottom:1px solid var(--border); padding-bottom:16px; display:flex; align-items:center; justify-content:space-between;}
.sb-title{font-family:'Cinzel',serif; font-size:16px; color:var(--amber); letter-spacing:2px;}
.sb-body{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:24px;}

.m-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:2px;margin-bottom:8px;display:block;}
.m-input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--fg);padding:12px 16px;font-size:13px;outline:none;
}
.m-input:focus{border-color:var(--amber-dim);}
textarea.m-input{height:120px;resize:none;}

.sb-footer{margin-top:auto; padding-top:32px;}
.m-btn{
  width:100%; padding:14px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:3px;
  background:transparent; border:1px solid var(--amber-deep); color:var(--amber); cursor:pointer;
  transition:all 0.3s; text-transform:uppercase; margin-bottom:12px;
}
.m-btn:hover{background:rgba(255,176,0,0.05); border-color:var(--amber); box-shadow:0 0 20px rgba(255,176,0,0.1);}
.m-btn.danger{border-color:#331111; color:#773333;}
.m-btn.danger:hover{border-color:#ff2929; color:#ff2929; background:rgba(255,41,41,0.05);}

/* TOAST */
#toast{
  position:fixed;bottom:64px;left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--amber-dim);padding:12px 24px;
  font-size:10px;letter-spacing:2px;color:var(--amber);z-index:10000;
  display:none;box-shadow:0 0 30px rgba(0,0,0,0.8);
}

</style>
</head>
<body>

<div class="forge-grid"></div>

<div class="topbar">
  <a href="../" class="brand">blendStory<span class="sub">FORGE_0.46.0</span></a>
  <div class="bar-spacer"></div>
  <nav class="nav-links">
    <a class="nav-link active" onclick="setView('engine')">[ ENGINE ]</a>
    <a class="nav-link" onclick="setView('entities')">[ ENTITIES ]</a>
    <a class="nav-link" onclick="setView('archive')">[ ARCHIVE ]</a>
  </nav>
  <div style="margin-left:40px; border-left:1px solid var(--border); padding-left:40px;">
    <span id="sb-username" style="font-size:10px; color:var(--dim); margin-right:20px; letter-spacing:1px;">—</span>
    <button class="nav-link" onclick="doLogout()" style="color:var(--led-err)">[ DISCONNECT ]</button>
  </div>
</div>

<div class="engine-container">
  <canvas id="nodeCanvas"></canvas>
  <div class="node-view" id="nodeView"></div>
</div>

<div class="cmdbar">
  <span class="cmd-prompt">:</span>
  <input type="text" class="cmd-input" id="cmdInput" placeholder="ENTER_COMMAND... [?] FOR_HELP" autocomplete="off">
  <span class="cmd-msg" id="cmdMsg"></span>
</div>

<!-- CONFIG SIDEBAR -->
<div class="sidebar" id="configSidebar">
  <div class="sb-header">
    <div class="sb-title" id="sbTitle">MODULE_CONFIG</div>
    <div class="nav-link" onclick="closeSidebar()">[×]</div>
  </div>
  <div class="sb-body">
    <div>
      <label class="m-label">IDENTIFIER</label>
      <input class="m-input" id="sbTitleInput" type="text">
    </div>
    <div>
      <label class="m-label">LOGIC_STREAM</label>
      <textarea class="m-input" id="sbContentInput"></textarea>
    </div>
    <div id="sbGenWrap">
      <label class="m-label">NEURAL_EXPANSION</label>
      <button class="m-btn" onclick="doNeuralGen()">[ EXECUTE_LLM ]</button>
      <pre id="sbGenOut" style="font-size:10px; color:var(--blue); background:rgba(0,0,0,0.3); padding:12px; border:1px solid var(--border); display:none; white-space:pre-wrap;"></pre>
    </div>
  </div>
  <div class="sb-footer">
    <button class="m-btn" onclick="saveConfig()">[ COMMIT_NODE ]</button>
    <button class="m-btn danger" onclick="deleteNode()">[ PURGE_NODE ]</button>
  </div>
</div>

<div id="toast"></div>

<script src="../auth-guard.js"></script>
<script src="../blendstory-client.js"></script>
<script src="../mock-data.js"></script>
<script>
  // ─ STATE ─
  const TOKEN_KEY='blendstory_token', USER_KEY='blendstory_user';
  const userData=JSON.parse(sessionStorage.getItem(USER_KEY)||'{}');
  document.getElementById('sb-username').textContent = (userData.username || 'MASTER').toUpperCase();

  let BS = {
    nodes: JSON.parse(localStorage.getItem('forge_nodes') || '[]'),
    edges: JSON.parse(localStorage.getItem('forge_edges') || '[]'),
    nextId: parseInt(localStorage.getItem('forge_nid') || '100'),
    save: function() {
      localStorage.setItem('forge_nodes', JSON.stringify(this.nodes));
      localStorage.setItem('forge_edges', JSON.stringify(this.edges));
      localStorage.setItem('forge_nid', String(this.nextId));
    }
  };

  // Seed default nodes if empty
  if(BS.nodes.length === 0) {
    BS.nodes = [
      { id: 'n1', type: 'input', label: 'User Msg', content: 'hello...', x: 100, y: 200 },
      { id: 'n2', type: 'intention', label: 'Intention Gate', content: 'detect_intent', x: 380, y: 200 },
      { id: 'n3', type: 'dae', label: 'Eleven', content: 'id:59', x: 660, y: 200 }
    ];
    BS.edges = [
      { from: 'n1', to: 'n2' },
      { from: 'n2', to: 'n3' }
    ];
    BS.save();
  }

  // ─ ENGINE ─
  let canvas, ctx, view;
  let offset = { x: 0, y: 0 };
  let isDraggingView = false;
  let lastMouse = { x: 0, y: 0 };
  let drawingEdge = null;
  const client = new BlendStoryClient();

  function init() {
    canvas = document.getElementById('nodeCanvas');
    ctx = canvas.getContext('2d');
    view = document.getElementById('nodeView');
    
    resize();
    window.onresize = resize;

    renderNodes();
    
    view.onmousedown = (e) => {
      if (e.target === view) {
        isDraggingView = true;
        lastMouse = { x: e.clientX, y: e.clientY };
      }
    };
    window.onmousemove = (e) => {
      if (isDraggingView) {
        offset.x += e.clientX - lastMouse.x;
        offset.y += e.clientY - lastMouse.y;
        lastMouse = { x: e.clientX, y: e.clientY };
        updateViewTransform();
      }
      if (drawingEdge) {
        drawEdges(); // Redraw with temporary line
        drawTempEdge(e.clientX, e.clientY);
      }
    };
    window.onmouseup = () => { isDraggingView = false; drawingEdge = null; drawEdges(); };
    
    document.getElementById('cmdInput').addEventListener('keydown', (e) => {
      if(e.key === 'Enter') { parseCmd(e.target.value); e.target.value = ''; }
    });

    requestAnimationFrame(drawEdges);
    showToast('AMBER_FORGE CORE ONLINE');
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 64 - 40;
  }

  function updateViewTransform() {
    view.style.transform = `translate(${offset.x}px, ${offset.y}px)`;
  }

  function renderNodes() {
    view.innerHTML = '';
    BS.nodes.forEach(n => {
      const div = document.createElement('div');
      div.className = 'module';
      div.id = 'node-' + n.id;
      div.style.left = n.x + 'px';
      div.style.top = n.y + 'px';
      
      div.innerHTML = `
        <div class="socket in" onmousedown="startEdge('${n.id}', 'in', event)"></div>
        <div class="module-header" onmousedown="dragNode('${n.id}', event)">
          <span class="module-title">${n.type}</span>
          <div class="module-led"></div>
        </div>
        <div class="module-body" onclick="openConfig('${n.id}')">
          <div class="module-label">${n.label}</div>
          <div class="module-text">${n.content || ''}</div>
        </div>
        <div class="socket out" onmousedown="startEdge('${n.id}', 'out', event)"></div>
      `;
      view.appendChild(div);
    });
  }

  function dragNode(id, e) {
    e.stopPropagation();
    const n = BS.nodes.find(node => node.id === id);
    const div = document.getElementById('node-' + id);
    let dx = e.clientX - n.x;
    let dy = e.clientY - n.y;
    
    document.onmousemove = (me) => {
      n.x = me.clientX - dx;
      n.y = me.clientY - dy;
      div.style.left = n.x + 'px';
      div.style.top = n.y + 'px';
    };
    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;
      BS.save();
    };
  }

  function startEdge(id, type, e) {
    e.stopPropagation();
    drawingEdge = { fromId: id, type: type };
  }

  function drawEdges() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    
    BS.edges.forEach(e => {
      const n1 = BS.nodes.find(n => n.id === e.from);
      const n2 = BS.nodes.find(n => n.id === e.to);
      if(!n1 || !n2) return;

      const x1 = n1.x + 220 + offset.x;
      const y1 = n1.y + 50 + offset.y;
      const x2 = n2.x + offset.x;
      const y2 = n2.y + 50 + offset.y;

      drawBezier(x1, y1, x2, y2);
    });

    if(!drawingEdge) requestAnimationFrame(drawEdges);
  }

  function drawBezier(x1, y1, x2, y2) {
    const cp1x = x1 + (x2 - x1) / 2;
    const cp2x = x2 - (x2 - x1) / 2;
    
    const time = Date.now() / 1000;
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, 'var(--blue-dim)');
    grad.addColorStop((time % 1), 'var(--blue)');
    grad.addColorStop(1, 'var(--blue-dim)');

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cp1x, y1, cp2x, y2, x2, y2);
    ctx.strokeStyle = grad;
    ctx.stroke();
  }

  function drawTempEdge(mx, my) {
    const n = BS.nodes.find(node => node.id === drawingEdge.fromId);
    let x1, y1;
    if(drawingEdge.type === 'out') {
      x1 = n.x + 220 + offset.x;
      y1 = n.y + 50 + offset.y;
    } else {
      x1 = n.x + offset.x;
      y1 = n.y + 50 + offset.y;
    }
    
    // Check if mouse is over another socket
    const overNodeId = checkMouseOverSocket(mx, my);
    if(overNodeId && overNodeId !== drawingEdge.fromId) {
      if(drawingEdge.type === 'out') connectNodes(drawingEdge.fromId, overNodeId);
      else connectNodes(overNodeId, drawingEdge.fromId);
      drawingEdge = null;
      return;
    }

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(mx, my);
    ctx.strokeStyle = 'var(--amber-dim)';
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function checkMouseOverSocket(mx, my) {
    // Simple proximity check for sockets
    for(let n of BS.nodes) {
      const sx = n.x + (drawingEdge.type === 'out' ? 0 : 220) + offset.x;
      const sy = n.y + 50 + offset.y;
      const dist = Math.sqrt((mx-sx)**2 + (my-sy)**2);
      if(dist < 20) return n.id;
    }
    return null;
  }

  function connectNodes(from, to) {
    if(!BS.edges.find(e => e.from === from && e.to === to)) {
      BS.edges.push({ from, to });
      BS.save();
      showToast('LINK_ESTABLISHED');
    }
  }

  // ─ CONFIG ─
  let activeNodeId = null;
  function openConfig(id) {
    const n = BS.nodes.find(node => node.id === id);
    activeNodeId = id;
    document.getElementById('sbTitle').textContent = n.type.toUpperCase() + '_CONFIG';
    document.getElementById('sbTitleInput').value = n.label;
    document.getElementById('sbContentInput').value = n.content || '';
    document.getElementById('sbGenOut').style.display = 'none';
    document.getElementById('configSidebar').classList.add('open');
  }

  function closeSidebar() {
    document.getElementById('configSidebar').classList.remove('open');
  }

  function saveConfig() {
    const n = BS.nodes.find(node => node.id === activeNodeId);
    n.label = document.getElementById('sbTitleInput').value;
    n.content = document.getElementById('sbContentInput').value;
    BS.save();
    renderNodes();
    closeSidebar();
    showToast('NODE_STATE_SYNCED');
  }

  function deleteNode() {
    if(!confirm('PURGE_NODE_FROM_FORGE?')) return;
    BS.nodes = BS.nodes.filter(n => n.id !== activeNodeId);
    BS.edges = BS.edges.filter(e => e.from !== activeNodeId && e.to !== activeNodeId);
    BS.save();
    renderNodes();
    closeSidebar();
  }

  // ─ COMMANDS ─
  function parseCmd(cmd) {
    const parts = cmd.trim().split(/\s+/);
    const c = parts[0].toLowerCase();
    if(c === 'n' || c === ':n') {
      const type = parts[1] || 'task';
      const id = 'n' + BS.nextId++;
      BS.nodes.push({ id, type, label: 'new_' + type, content: '', x: 100 - offset.x, y: 100 - offset.y });
      BS.save();
      renderNodes();
    } else if (c === 'clear') {
      BS.nodes = []; BS.edges = []; BS.save(); renderNodes();
    } else if (c === 'logout') {
      doLogout();
    }
  }

  async function doNeuralGen() {
    const n = BS.nodes.find(node => node.id === activeNodeId);
    const out = document.getElementById('sbGenOut');
    out.style.display = 'block';
    out.textContent = 'EXECUTING_COGNITIVE_RUN...';
    try {
      let acc = '';
      await client.chat({
        model: 'llama-3.1-8b',
        messages: [{role:'user', content: 'Expand this behavioral logic: ' + (n.content || n.label)}],
        onDelta: (d) => { acc += d; out.textContent = acc; }
      });
      document.getElementById('sbContentInput').value = acc;
    } catch(e) {
      out.textContent = 'ERROR: ' + e.message;
    }
  }

  function doLogout() {
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(USER_KEY);
    window.location.href = '../login/';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = '[ ' + msg + ' ]';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function setView(v) { showToast('SWITCHING_TO_' + v.toUpperCase()); }

  init();
</script>
</body>
</html>
