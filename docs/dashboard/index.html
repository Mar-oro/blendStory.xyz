<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blendStory · AMBER_FORGE_DASHBOARD</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=JetBrains+Mono:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #080a0c; --bg2: #0c0e12; --bg3: #12161a;
  --amber: #ffb000; --amber-dim: #996a00; --amber-deep: #442a00;
  --blue: #0055ff; --blue-dim: #0033aa;
  --fg: #d0d8e0; --dim: #5a6a7a; --border: #1a1e24;
  --led-ok: #00ff41; --led-warn: #ffb000; --led-err: #ff2929;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;}
body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);color:var(--fg);
  font-size:13px;line-height:1.4;overflow:hidden;
}

/* SCANLINES */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,176,0,0.02) 3px,rgba(255,176,0,0.02) 4px);
  pointer-events:none;z-index:9000;
}

/* GRID BG */
.forge-grid{
  position:fixed;inset:0;
  background-image: 
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 1; opacity: 0.3;
}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;gap:24px;padding:0 32px;
  background:rgba(8,10,12,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--amber-deep);height:64px;position:relative;z-index:100;
}
.brand{
  font-family:'Cinzel',serif;font-size:18px;letter-spacing:4px;color:var(--amber);
  text-decoration:none;text-shadow:0 0 15px rgba(255,176,0,0.4);
}
.brand .sub{font-family:'Space Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:2px;margin-left:12px;text-transform:uppercase;}
.bar-spacer{flex:1}
.nav-links{display:flex;gap:32px;}
.nav-link{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--dim);
  text-decoration:none;transition:all 0.3s;text-transform:uppercase;cursor:pointer;
}
.nav-link:hover, .nav-link.active{color:var(--amber);text-shadow:0 0 10px var(--amber-dim);}

/* NODE ENGINE */
.engine-container{
  position:relative;width:100%;height:calc(100vh - 64px);
  overflow:hidden;z-index:10;
}
#nodeCanvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:5;pointer-events:none;
}
.node-view{
  position:absolute;inset:0;cursor:grab;z-index:10;
}
.node-view:active{cursor:grabbing;}

/* MODULE NODES */
.module{
  position:absolute;width:220px;
  background:rgba(12,14,18,0.95);border:1px solid var(--border);
  padding:1px;box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition:border-color 0.3s, box-shadow 0.3s;
  user-select:none;
}
.module:hover{
  border-color:var(--amber-dim);
  box-shadow: 0 10px 40px rgba(255,176,0,0.1);
}
.module.active{border-color:var(--amber);box-shadow: 0 0 20px rgba(255,176,0,0.2);}

.module-header{
  background:var(--bg3);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.module-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;}
.module-led{width:6px;height:6px;border-radius:50%;background:var(--led-ok);box-shadow:0 0 8px var(--led-ok);}

.module-body{padding:16px;font-size:11px;color:var(--dim);}
.module-label{color:var(--fg);font-size:14px;margin-bottom:8px;}

/* SOCKETS */
.socket{
  position:absolute;width:12px;height:12px;background:var(--bg);border:2px solid var(--border);
  border-radius:50%;z-index:20;transition:all 0.2s;
}
.socket:hover{border-color:var(--blue);background:var(--blue-dim);}
.socket.in{left:-7px;top:50%;transform:translateY(-50%);}
.socket.out{right:-7px;top:50%;transform:translateY(-50%);}

/* SIDEBARS */
.sidebar{
  position:absolute;top:0;bottom:0;width:300px;background:rgba(10,12,14,0.95);
  border-left:1px solid var(--amber-deep);right:-300px;transition:right 0.4s cubic-bezier(0.19, 1, 0.22, 1);
  z-index:200;padding:32px;backdrop-filter:blur(15px);display:flex;flex-direction:column;
}
.sidebar.open{right:0;}
.sidebar-header{margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:16px;}
.sidebar-title{font-family:'Cinzel',serif;font-size:16px;color:var(--amber);letter-spacing:2px;}

/* TOAST */
#toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--amber-dim);padding:12px 24px;
  font-size:10px;letter-spacing:2px;color:var(--amber);z-index:10000;
  display:none;box-shadow:0 0 30px rgba(0,0,0,0.8);
}

</style>
</head>
<body>

<div class="forge-grid"></div>

<div class="topbar">
  <a href="../" class="brand">blendStory<span class="sub">FORGE_0.46.0</span></a>
  <div class="bar-spacer"></div>
  <nav class="nav-links">
    <a class="nav-link active" onclick="setView('engine')">[ ENGINE ]</a>
    <a class="nav-link" onclick="setView('entities')">[ ENTITIES ]</a>
    <a class="nav-link" onclick="setView('archive')">[ ARCHIVE ]</a>
  </nav>
  <div style="margin-left:40px; border-left:1px solid var(--border); padding-left:40px;">
    <button class="nav-link" onclick="logout()" style="color:var(--led-err)">[ DISCONNECT ]</button>
  </div>
</div>

<div class="engine-container">
  <canvas id="nodeCanvas"></canvas>
  <div class="node-view" id="nodeView"></div>
</div>

<div class="sidebar" id="configSidebar">
  <div class="sidebar-header">
    <div class="sidebar-title" id="sideTitle">MODULE_CONFIG</div>
  </div>
  <div id="sideContent"></div>
  <div style="margin-top:auto; padding-top:40px;">
    <button class="nav-link" style="border:1px solid var(--amber-deep); padding:10px 20px; width:100%;" onclick="closeSidebar()">[ COMMIT_CHANGES ]</button>
  </div>
</div>

<div id="toast"></div>

<script src="../auth-guard.js"></script>
<script src="../mock-data.js"></script>
<script>
  let canvas, ctx;
  let currentFlow = MOCK_BEHAVIORS[0];
  let nodes = currentFlow.nodes;
  let edges = currentFlow.edges;
  let offset = { x: 0, y: 0 };
  let isDraggingView = false;
  let lastMouse = { x: 0, y: 0 };

  function init() {
    canvas = document.getElementById('nodeCanvas');
    ctx = canvas.getContext('2d');
    resize();
    window.onresize = resize;

    renderNodes();
    drawEdges();

    const view = document.getElementById('nodeView');
    view.onmousedown = (e) => {
      if (e.target === view) {
        isDraggingView = true;
        lastMouse = { x: e.clientX, y: e.clientY };
      }
    };
    window.onmousemove = (e) => {
      if (isDraggingView) {
        offset.x += e.clientX - lastMouse.x;
        offset.y += e.clientY - lastMouse.y;
        lastMouse = { x: e.clientX, y: e.clientY };
        updatePosition();
      }
    };
    window.onmouseup = () => { isDraggingView = false; };
    
    showToast('AMBER_FORGE ENGINE ONLINE');
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 64;
    drawEdges();
  }

  function renderNodes() {
    const view = document.getElementById('nodeView');
    view.innerHTML = '';
    nodes.forEach(n => {
      const div = document.createElement('div');
      div.className = 'module';
      div.id = n.id;
      div.style.left = n.x + 'px';
      div.style.top = n.y + 'px';
      div.innerHTML = `
        <div class="socket in"></div>
        <div class="module-header">
          <span class="module-title">${n.type}</span>
          <div class="module-led"></div>
        </div>
        <div class="module-body">
          <div class="module-label">${n.label}</div>
          <div style="opacity:0.4; font-size:9px;">UID: ${n.id}</div>
        </div>
        <div class="socket out"></div>
      `;
      div.onclick = () => openConfig(n);
      view.appendChild(div);
      makeDraggable(div, n);
    });
  }

  function makeDraggable(el, node) {
    let dx = 0, dy = 0;
    el.onmousedown = (e) => {
      e.stopPropagation();
      dx = e.clientX - el.offsetLeft;
      dy = e.clientY - el.offsetTop;
      document.onmousemove = (me) => {
        node.x = me.clientX - dx;
        node.y = me.clientY - dy;
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        drawEdges();
      };
      document.onmouseup = () => {
        document.onmousemove = null;
        document.onmouseup = null;
      };
    };
  }

  function drawEdges() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    
    edges.forEach(e => {
      const fromNode = nodes.find(n => n.id === e.from);
      const toNode = nodes.find(n => n.id === e.to);
      if (!fromNode || !toNode) return;

      const x1 = fromNode.x + 220 + offset.x;
      const y1 = fromNode.y + 50 + offset.y;
      const x2 = toNode.x + offset.x;
      const y2 = toNode.y + 50 + offset.y;

      const cp1x = x1 + (x2 - x1) / 2;
      const cp2x = x2 - (x2 - x1) / 2;

      const time = Date.now() / 1000;
      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0, 'var(--blue-dim)');
      grad.addColorStop((time % 1), 'var(--blue)');
      grad.addColorStop(1, 'var(--blue-dim)');

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(cp1x, y1, cp2x, y2, x2, y2);
      ctx.strokeStyle = grad;
      ctx.stroke();
    });
    
    requestAnimationFrame(drawEdges);
  }

  function updatePosition() {
    const view = document.getElementById('nodeView');
    view.style.transform = `translate(${offset.x}px, ${offset.y}px)`;
  }

  function openConfig(node) {
    const sb = document.getElementById('configSidebar');
    const title = document.getElementById('sideTitle');
    const content = document.getElementById('sideContent');
    
    title.textContent = node.type.toUpperCase() + '_CONFIG';
    content.innerHTML = `
      <div style="margin-bottom:24px;">
        <label style="display:block; font-size:9px; color:var(--dim); margin-bottom:8px;">MODULE_LABEL</label>
        <input type="text" value="${node.label}" style="width:100%; background:var(--bg); border:1px solid var(--border); color:var(--fg); padding:10px; outline:none;">
      </div>
      <div style="margin-bottom:24px;">
        <label style="display:block; font-size:9px; color:var(--dim); margin-bottom:8px;">RAW_DATA</label>
        <pre style="font-size:10px; color:var(--blue); background:rgba(0,0,0,0.3); padding:12px; border:1px solid var(--border); overflow:auto;">${JSON.stringify(node.config || {}, null, 2)}</pre>
      </div>
    `;
    sb.classList.add('open');
  }

  function closeSidebar() {
    document.getElementById('configSidebar').classList.remove('open');
    showToast('NODE_STATE_PERSISTED');
  }

  function logout() {
    localStorage.removeItem('jezabel_token');
    window.location.href = '../login/';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = '[ ' + msg + ' ]';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function setView(v) {
    showToast('SWITCHING_TO_' + v.toUpperCase());
  }

  init();
</script>
</body>
</html>
