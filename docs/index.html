<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blendStory · THE_FORGE</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=JetBrains+Mono:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #080a0c; --bg2: #0c0e12; --bg3: #12161a;
  --amber: #ffb000; --amber-dim: #996a00; --amber-deep: #442a00;
  --fg: #d0d8e0; --dim: #3a4a5a; --border: #1a1e24;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;flex-direction:column;
  overflow-x:hidden;
}
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,176,0,0.02) 3px,rgba(255,176,0,0.02) 4px);
  pointer-events:none;z-index:9000;
}

/* GRID BG */
.forge-grid{
  position:fixed;inset:0;
  background-image: 
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 1; opacity: 0.3;
}

/* HEADER */
.header{
  padding:32px 60px;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:10;
}
.brand{
  font-family:'Cinzel',serif;font-size:24px;letter-spacing:6px;color:var(--amber);
  text-decoration:none;text-shadow:0 0 20px rgba(255,176,0,0.4);
}
.brand .sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:3px;margin-left:16px;text-transform:uppercase;}

/* HERO */
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 40px;position:relative;z-index:10;text-align:center;
}
.forge-icon{
  width:120px;height:120px;border:1px solid var(--amber-deep);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:48px;position:relative;
}
.forge-icon::before{
  content:'';position:absolute;inset:-10px;border:1px solid var(--border);
}
.forge-icon span{font-family:'Cinzel',serif;font-size:60px;color:var(--amber);text-shadow:0 0 30px var(--amber-dim);}

.hero-title{
  font-family:'Cinzel',serif;font-size:clamp(32px, 8vw, 64px);color:var(--fg);
  letter-spacing:12px;margin-bottom:24px;text-transform:uppercase;
}
.hero-desc{
  font-family:'Space Mono',monospace;font-size:12px;color:var(--dim);
  max-width:600px;line-height:1.8;letter-spacing:2px;margin-bottom:56px;
}

.cta-group{display:flex;gap:32px;}
.cta-btn{
  padding:18px 48px;border:1px solid var(--amber-dim);color:var(--amber);
  text-decoration:none;font-family:'Space Mono',monospace;font-size:11px;
  letter-spacing:4px;text-transform:uppercase;transition:all 0.4s;
}
.cta-btn:hover{
  background:rgba(255,176,0,0.05);border-color:var(--amber);
  box-shadow: 0 0 30px rgba(255,176,0,0.2);transform:translateY(-2px);
}
.cta-btn.dim{border-color:var(--border);color:var(--dim);}
.cta-btn.dim:hover{border-color:var(--dim);color:var(--fg);}

/* FOOTER */
.footer{
  padding:40px 60px;display:flex;justify-content:space-between;
  position:relative;z-index:10;border-top:1px solid var(--border);
}
.f-seg{font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
.f-seg span{color:var(--amber-dim);}

</style>
</head>
<body>

<div class="forge-grid"></div>

<header class="header">
  <a href="index.html" class="brand">blendStory<span class="sub">V_0.46.0</span></a>
  <div class="f-seg">STATUS: <span>CORE_STABLE</span></div>
</header>

<main class="hero">
  <div class="forge-icon">
    <span>B</span>
  </div>
  <h1 class="hero-title">The Forge</h1>
  <p class="hero-desc">
    BEHAVIORAL_AUTHORSHIP_INTERFACE. WIRING_CONSCIOUSNESS_THROUGH_NEURAL_NODES. 
    ADMIN_LEVEL_ACCESS_ONLY.
  </p>
  
  <div class="cta-group">
    <a href="login/" class="cta-btn">[ ENTER_FORGE ]</a>
    <a href="https://jezabel.net" class="cta-btn dim">[ JEZABEL.NET ]</a>
  </div>
</main>

<footer class="footer">
  <div class="f-seg">© 2026 // AMBER_FORGE_INFRASTRUCTURE</div>
  <div class="f-seg">DESIGN_SYSTEM: <span>BLUEPRINT_ALPHA</span></div>
</footer>

</body>
</html>
